; PHP de PRODUCAO (Railway / FrankenPHP). Copiado para conf.d/ pelo Dockerfile da raiz.
; A imagem dunglas/frankenphp nao traz php.ini nenhum: sem este arquivo valem os
; defaults de compilacao, que anunciam a versao do PHP em todo response
; (`X-Powered-By`) e imprimem erro na saida (`display_errors = 1`).

; Nao anunciar a versao exata do PHP: so ajuda quem procura CVE para ela.
expose_php = Off

; Erro vai para o log (stderr -> logs do Railway), nunca para o corpo da resposta.
; O Laravel ja renderiza a propria pagina de erro; isto cobre o que escapa dele
; (fatal no bootstrap, antes do handler existir).
display_errors = Off
display_startup_errors = Off
log_errors = On
