server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 64M;

    location / {
        # So os estaticos ficam com este header aqui: o fallback para index.php e
        # um redirect interno para o location do PHP, onde o Laravel emite o seu
        # (middleware CabecalhosSeguranca) — sem duplicar. Espelha o Caddyfile.
        add_header X-Content-Type-Options nosniff always;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
